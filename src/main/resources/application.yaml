spring:
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/faang}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: user-group
      auto-offset-reset: earliest
    topics:
      user-ban-topic:
        name: user_ban_topic
      user-deactivation-topic:
        name: user_deactivation_topic
      analytics-user-profile-view-topic:
        name: analytics_user_view_profile_topic
      event-start-topic:
        name: event_start_topic

  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_URL:localhost}

  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8080

project-service:
  host: ${PROJECT_SERVICE_HOST:localhost}
  port: ${PROJECT_SERVICE_PORT:8082}

payment-service:
  host: ${PAYMENT_SERVICE_HOST:localhost}
  port: ${PAYMENT_SERVICE_PORT:8082}

swagger:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  download-path: ${S3_DOWNLOAD_PATH:/api/v1/buckets/corpbucket/objects/download?preview=true&prefix=}
  bucketName: ${S3_BUCKET_NAME:corpbucket}

dicebear:
  apiUrl: ${DICEBEAR_API_URL:https://api.dicebear.com/9.x}
  connectionTimeoutSeconds: 10
  readTimeoutSeconds: 10

avatar:
  bucketName: ${S3_AVATAR_BUCKET_NAME:user-avatars}

goal:
  max-active-goals-per-user: 3

premium:
  removal:
    cron: "0 0 3 * * ?"  # Запуск каждый день в 03:00 (Quartz формат)
    batch-size: 100
    thread-pool-size: 4

event:
  removal:
    cron: "0 0 6 * * SAT"
  start-notification:
    cron: "0 */10 * * * *"
    intervals:
      - time: 1440
        message: "Event starts in 1 day"
      - time: 300
        message: "Event starts in 5 hours"
      - time: 60
        message: "Event starts in 1 hour"
      - time: 10
        message: "Event starts in 10 minutes"




image:
  avatar:
    folder-name: users_avatars
    sizes:
      large: 1080
      small: 170
